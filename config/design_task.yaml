# Fixed parameters of the 36-dim design task (CLAUDE.md §7.4, §17 D2).
#
# TODO D2: to be decided by M. EVERY value in this file is a PLACEHOLDER chosen only so that
# data/sampler.py:design_board runs and its records validate. None of them comes from CLAUDE.md.
# Changing a value changes every design-space board; log the final choice in docs/decisions.md (D2).
#
# Units: mm for geometry, W for power, W/(m²·K) for convection, vias/mm² for via density
# (board-record units, CLAUDE.md §10.1). Read by data/sampler.py, which validates every key.
design_task_version: "0-placeholder"

# Layout of x in [0, 1]^36, in the order of CLAUDE.md §7.4:
#   x[0:8]   chip centres (cx, cy) for chips 0..3
#   x[8:32]  six L1 copper rectangles, (x, y, w, h) each
#   x[32:36] via density under chips 0..3
# PLACEHOLDER mappings (affine, every component in [0, 1]):
#   chip centre  c = lo + x * (hi - lo), lo = edge_margin + size/2, hi = 100 - edge_margin - size/2
#   rect size    w = lo + x * (hi - lo) over rect_side;  rect corner x0 = x * (100 - w)  (same for y, h)
#   via density  d = lo + x * (hi - lo) over via_density
mapping:
  rect_side: [5.0, 40.0]      # PLACEHOLDER (mm); borrows the §6.5 rect side range
  via_density: [0.0, 1.0]     # PLACEHOLDER (vias/mm²); 0 = no via array effect
  enforce_l1_coverage: false  # PLACEHOLDER; the §6.5 mean-phi rule is for random boards

chips:                        # PLACEHOLDER sizes (mm) and powers (W); total must stay <= 6 W
  - {w: 10.0, h: 10.0, P: 1.5}
  - {w: 12.0, h: 6.0, P: 1.0}
  - {w: 8.0, h: 8.0, P: 1.0}
  - {w: 6.0, h: 6.0, P: 0.5}

stack: {outer_oz: 1, inner_oz: 1, k_fr4_xy: 0.81}   # PLACEHOLDER

layers:                       # PLACEHOLDER: L2 full plane, L3 split in two halves, L4 bare
  l2_cutouts: []
  l3_split_rects:
    - {type: rect, x0: 0.0, y0: 0.0, w: 50.0, h: 100.0}
    - {type: rect, x0: 50.0, y0: 0.0, w: 50.0, h: 100.0}
  l4_shapes: []

background_via_density_per_mm2: 0.02                 # PLACEHOLDER
convection: {h_top: 10.0, h_bot: 10.0, forced_zone: null}   # PLACEHOLDER
dirichlet_edges: []                                  # PLACEHOLDER
