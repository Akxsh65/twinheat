[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinheat"
version = "0.0.0"
description = "Certified neural surrogates for interactive circuit-board thermal design."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["twinheat"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "slow: long-running test, run nightly (excluded from push CI)",
    "gpu: needs a CUDA GPU, run by hand on Kaggle (excluded from CI)",
]
