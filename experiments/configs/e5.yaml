# E5 surrogate accuracy, OOD score and energy-form ablation (M2.3; CLAUDE.md §11.5, §12, §6.7).
# Committed BEFORE the run: experiments/e5_accuracy.py refuses a config with uncommitted changes
# (CLAUDE.md §4: hyperparameters of reported runs come only from committed configs). No value here
# is tuned on test or OOD data. `null` = not decided yet: the script stops and names it.

data_root: null                 # dataset v1 root (one folder per split); or pass --data
registry: models/registry.json
norm_stats: models/norm_stats.json
N: 256                          # evaluation resolution (§7.3)
batch: 4                        # inference batch (memory only; does not change any number)

# ID test and every OOD set of dataset v1 (§7.4 v2; ood_5 is not OOD on 4 layers, docs/decisions.md).
# ood_bottom_chips is listed once generated (gpu_instructions.md section 6); the model has no L4
# heat channel, so it is expected to fail there and the rule check sends those boards to the solver.
splits: [test, ood_1, ood_2, ood_3, ood_4, ood_6, ood_7, ood_3oz, ood_dense_vias, ood_bottom_chips]

models:                         # label -> registry selection (models/ensemble.py)
  ensemble:          {arch: fno, stage: ft256, variant: base}                 # mean of the 5 members
  fno_pre128_at_256: {arch: fno, stage: pre128, variant: base}                # 128-only, zero-shot at 256
  unet:              {arch: unet, stage: ft256, variant: base}
  fno_local:         {arch: fno_local, stage: ft256, variant: base}
each_member: true               # also one row per ensemble member

go_no_go:                       # CLAUDE.md §12 week-5 go/no-go
  model: ensemble
  split: test
  rel_l2_max: 0.03              # "ID mean relative L2 < 3 %"
  hotspot_K_max: 1.5            # "hotspot error < 1.5 K"
  hotspot_metric: hotspot_l1_K  # UNSURE: §12 says "hotspot error"; this is the same quantity M2.2
                                # early-stops on (mean |error| over the 64 hottest true cells). The
                                # peak-temperature error is reported next to it.

ood:                            # §6.7 runtime OOD flag, check (2)
  members: {arch: fno, stage: ft256, variant: base}
  fit_split: train              # mean + Ledoit-Wolf covariance of pooled features
  threshold_split: val          # threshold = 95th percentile of validation scores
  threshold_percentile: 95
  fit_max_boards: null          # null = every train board

energy_ablation:                # §12: energy-form loss at 0 / 100 / 1k labels; one ablation row
  stage: pre128
  member: 1
  seed: null                    # M to set (frozen.yaml)
  epochs: null                  # M to set
  energy_weight: null           # M to set: weight of E/(Σ|b|·σ_θ) against the data loss
  runs:                         # labels = train boards that carry the data loss
    - {labels: 0, energy: true}
    - {labels: 100, energy: true}
    - {labels: 100, energy: false}
    - {labels: 1000, energy: true}
    - {labels: 1000, energy: false}
