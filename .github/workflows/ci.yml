name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nightly slow tests

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: ruff check .
      - name: Fail if no tests are collected
        run: |
          n=$(python -m pytest -m "not slow and not gpu" --collect-only -q | grep -c "::" || true)
          echo "collected $n tests"
          test "$n" -ge 1
      - run: python -m pytest -m "not slow and not gpu" -q

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -m "slow and not gpu" -q
