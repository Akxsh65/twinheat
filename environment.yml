# TwinHeat conda environment for laptops (CLAUDE.md §4: Python 3.11).
# Create:  conda env create -f environment.yml && conda activate twinheat
# Update:  conda env update -f environment.yml --prune
# Verify:  python scripts/verify_env.py
#
# Versions are identical to requirements.txt (the Kaggle route); see the comments there for why
# each CUDA-related pin was chosen. scripts/verify_env.py checks the two files stay in agreement
# with what is installed. Every conda pin below was confirmed to exist on conda-forge on
# 2026-10-23, but the solve itself has not been run: UNSURE until `conda env create` succeeds.
name: twinheat
channels:
  - conda-forge
dependencies:
  - python=3.11            # CLAUDE.md §4. (Kaggle runs 3.13; no 3.11/3.13-specific syntax is used.)
  - pip
  # numerics: same pins as requirements.txt
  - numpy=2.1.3            # numba 0.61.2 caps numpy < 2.3
  - scipy=1.16.3
  - numba=0.61.2
  - pyamg=5.3.0
  # service and data
  - fastapi=0.161.1
  - uvicorn=0.54.0
  - websockets=17.3
  - pydantic=2.14.1
  - jsonschema=4.26.0
  - pyyaml=6.0.3
  - pandas=3.1.0
  - pyarrow=25.0.0
  - matplotlib-base=3.11.2
  # dev
  - pytest=9.1.1
  - ruff=0.17.2
  # GPU packages come from pip, not conda-forge, so the laptop gets the very same wheels as
  # Kaggle (conda-forge picks CPU/CUDA builds by virtual package and may differ).
  - pip:
      - torch==2.11.0           # CUDA 12.8 build on Kaggle (+cu128). On Windows PyPI gives CPU only.
      - cupy-cuda12x==14.0.1    # CUDA 12 wheels; needs an NVIDIA driver >= CUDA 12 on the laptop
